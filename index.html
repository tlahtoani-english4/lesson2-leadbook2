<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Book 2 Lesson 2 Vocabulary</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#f7f3fb;--card:#ffffff;--fg:#2a1f3a;--muted:#6a5c80;--line:#e3d9f0;--soft:#efe6fa;--hl:#fff1c4;--es:#1d6b42;--esbg:#e6f5ec;--accent:#7A3FB5;--ontop:#ffffff;
--display:'Baloo 2','Trebuchet MS',sans-serif;--body:'Nunito','Segoe UI',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#1a1326;--card:#251b35;--fg:#f3ecfb;--muted:#b9a8d2;--line:#3b2d52;--soft:#33254a;--hl:#5a4510;--es:#8fe0b2;--esbg:#17352a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;padding-inline:16px}
.app{height:100%;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,18px);padding-block:clamp(8px,1.6vh,18px)}
.bar{display:flex;align-items:center;gap:12px;flex:none;flex-wrap:wrap}
.bar img{width:clamp(36px,6vh,56px);height:clamp(36px,6vh,56px);border-radius:50%;background:#fff}
.ttl{font-family:var(--display);font-weight:800;font-size:clamp(16px,3vh,28px);line-height:1}
.ttl small{display:block;font-size:.6em;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-family:var(--body)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin-left:auto}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:3px solid #F0A81C;outline-offset:2px}
.seg button{font-weight:800;font-size:clamp(14px,2.4vh,20px);border:0;background:transparent;color:var(--muted);padding:.5em 1em;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.list{border:2px solid var(--line);background:var(--card);color:var(--fg);font-weight:800;font-size:clamp(14px,2.4vh,20px);border-radius:999px;padding:.5em 1em}
.slide{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:clamp(10px,2vw,28px)}
.left{background:var(--c);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.8vh,20px);padding:clamp(12px,3vh,32px);text-align:center;color:var(--ontop);min-width:0}
.left.dk{color:#2a1f3a}
.pic{font-size:clamp(56px,17vh,170px);line-height:1;background:rgba(255,255,255,.92);border-radius:28px;width:1.25em;height:1.25em;display:grid;place-items:center}
.word{font-family:var(--display);font-weight:800;font-size:clamp(36px,min(11vh,8vw),130px);line-height:1;overflow-wrap:anywhere}
.pos{font-weight:800;font-size:clamp(16px,3vh,30px);opacity:.95}
.gloss{background:rgba(255,255,255,.95);color:#1d6b42;font-weight:800;font-size:clamp(16px,3.4vh,34px);padding:.25em .9em;border-radius:999px}
.say{border:0;background:rgba(255,255,255,.95);border-radius:999px;font-weight:800;font-size:clamp(16px,3.2vh,30px);padding:.4em 1.2em;color:#2a1f3a}
.say:active{transform:scale(.96)}
.right{display:flex;flex-direction:column;gap:clamp(8px,1.8vh,20px);min-height:0}
.sec{flex:1;min-height:0;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:clamp(10px,2.2vh,26px) clamp(14px,2vw,28px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vw,28px);align-content:center}
.lab{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:clamp(12px,2vh,18px);color:var(--muted);margin-bottom:.3em}
.col p{margin:0;font-weight:700;font-size:clamp(18px,min(4.2vh,2.8vw),46px);line-height:1.25}
.col.es{background:var(--esbg);color:var(--es);border-radius:18px;padding:clamp(8px,1.6vh,18px) clamp(10px,1.4vw,20px)}
.col.es .lab{color:var(--es)}
.col em{font-style:normal;background:var(--hl);border-radius:6px;padding:0 .15em}
body[data-lang="en"] .col.es{display:none}
body[data-lang="en"] .sec{grid-template-columns:1fr}
body[data-lang="es"] .col.en{display:none}
body[data-lang="es"] .sec{grid-template-columns:1fr}
.nav{display:flex;align-items:center;gap:12px;flex:none}
.nav button{border:0;background:var(--accent);color:#fff;font-weight:800;font-size:clamp(18px,3.4vh,32px);border-radius:999px;padding:.35em 1.4em}
.nav button:disabled{opacity:.35;cursor:default}
.dots{flex:1;display:flex;gap:clamp(4px,.8vw,10px);justify-content:center;flex-wrap:wrap}
.dots button{width:clamp(12px,2.2vh,22px);height:clamp(12px,2.2vh,22px);border-radius:50%;border:0;padding:0;background:var(--line)}
.dots button[aria-current="true"]{background:var(--accent);transform:scale(1.35)}
.cnt{font-weight:800;color:var(--muted);font-size:clamp(14px,2.6vh,24px);min-width:3.5em;text-align:center}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;padding:16px;display:none;flex-direction:column;gap:12px}
.overlay.on{display:flex}
.overlay .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));grid-auto-rows:1fr;gap:10px}
.overlay .grid button{border:0;border-radius:18px;background:var(--c);color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(18px,3.2vh,32px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.overlay .grid button.dk{color:#2a1f3a}
.overlay .grid span{font-size:1.7em}
@media (max-aspect-ratio:1/1){
 body{overflow:auto}
 .app{height:auto;min-height:100%}
 .slide{grid-template-columns:1fr}
 .left{flex-direction:row;flex-wrap:wrap;gap:10px}
 .pic{font-size:60px}.word{font-size:44px}
 .sec{grid-template-columns:1fr!important}
 .col p{font-size:20px}
}
</style>
</head>
<body>
<div class="app">
 <div class="bar"><img src="logo.png" alt="Colegio Tlahtoani"><div class="ttl"><small>Lead Book 2 · Lesson 2</small>Vocabulary</div>
  <button class="list" id="open">☰ All words</button>
  <div class="seg" role="group" aria-label="Language"><button data-l="both" aria-pressed="true">English + Español</button><button data-l="en" aria-pressed="false">English</button><button data-l="es" aria-pressed="false">Español</button></div></div>
 <main class="slide" id="slide"></main>
 <div class="nav"><button id="prev" aria-label="Previous word">◀</button><div class="dots" id="dots"></div><span class="cnt" id="cnt"></span><button id="next" aria-label="Next word">▶</button></div>
</div>
<div class="overlay" id="ov"><div class="bar"><div class="ttl">All words</div><button class="list" id="close" style="margin-left:auto">✕ Close</button></div><div class="grid" id="ovgrid"></div></div>
<script>
const W=[
["mushrooms","n.","hongos / champiñones","🍄","Small plants with no leaves or flowers that you can eat. They grow in damp places.","Plantas pequeñas sin hojas ni flores que se pueden comer. Crecen en lugares húmedos.","We put mushrooms on the pizza.","Pusimos champiñones en la pizza."],
["savory","adj.","salado / sabroso","🥨","Having a salty or spicy taste, not sweet.","Con sabor salado o picante, no dulce.","Cheese pie is a savory snack.","El pay de queso es una botana salada."],
["imaginary","adj.","imaginario","🦄","Not real. It is only in your mind.","No es real. Solo existe en tu mente.","My imaginary friend lives on the moon.","Mi amigo imaginario vive en la luna."],
["eggplant","n.","berenjena","🟣","A big, shiny, purple vegetable that is white inside.","Una verdura grande, morada y brillante que es blanca por dentro.","The eggplant is purple and shiny.","La berenjena es morada y brillante."],
["delightful","adj.","encantador / delicioso","😍","Very nice. It gives you a lot of pleasure.","Muy agradable. Te da mucho gusto.","The soup smells delightful.","La sopa huele delicioso."],
["spinach","n.","espinaca","🥬","A vegetable with dark green leaves.","Una verdura de hojas verde oscuro.","I eat spinach salad for lunch.","Como ensalada de espinaca en la comida."],
["pastry","n.","pastel / pan dulce / masa horneada","🥐","A baked food made with flour, butter and water, like a pie or a croissant.","Un alimento horneado hecho con harina, mantequilla y agua, como un pay o un cuernito.","My grandma bakes a pastry on Sundays.","Mi abuela hornea un pastel los domingos."],
["underneath","prep.","debajo de","⬇️","Under something. In a lower place.","Abajo de algo. En un lugar más bajo.","The cat is underneath the table.","El gato está debajo de la mesa."],
["custard","n.","natilla / flan","🍮","A soft, sweet, yellow food made with milk and eggs.","Un postre suave, dulce y amarillo hecho con leche y huevos.","We ate custard for dessert.","Comimos natilla de postre."],
["layers","n.","capas","🍰","Flat parts of something, one on top of the other.","Partes planas de algo, una encima de otra.","The cake has three layers.","El pastel tiene tres capas."],
["sauce","n.","salsa","🥫","A liquid food that you put on other food.","Un alimento líquido que se pone sobre otra comida.","I like tomato sauce on my spaghetti.","Me gusta la salsa de tomate en mi espagueti."],
["deceived","v. (past)","engañó / engañado","🦊","Made someone believe something that is not true. Tricked.","Hizo creer a alguien algo que no es verdad. Engañó.","The fox deceived the crow.","El zorro engañó al cuervo."],
["appetite","n.","apetito / hambre","😋","The feeling that you want to eat.","La sensación de querer comer.","I have a big appetite after soccer.","Tengo mucho apetito después del fútbol."],
["zucchini","n.","calabacita","🥒","A long, green vegetable.","Una verdura larga y verde.","Mom cooked zucchini with cheese.","Mamá cocinó calabacitas con queso."]
];
const C=['#7A3FB5','#2E9E5B','#F0A81C','#1E4C86'];
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hi=(s,w)=>esc(s).replace(new RegExp('('+w+')','i'),'<em>$1</em>');
let cur=0;
const slide=document.getElementById('slide'),dots=document.getElementById('dots'),cnt=document.getElementById('cnt');
const prev=document.getElementById('prev'),next=document.getElementById('next'),ov=document.getElementById('ov');
W.forEach((w,i)=>{
 const d=document.createElement('button');d.setAttribute('aria-label',w[0]);d.onclick=()=>go(i);dots.appendChild(d);
 const o=document.createElement('button');o.className=C[i%4]==='#F0A81C'?'dk':'';o.style.setProperty('--c',C[i%4]);o.innerHTML='<span>'+w[3]+'</span>'+w[0];o.onclick=()=>{go(i);ov.classList.remove('on')};document.getElementById('ovgrid').appendChild(o);
});
function render(){
 const [word,pos,gl,pic,dE,dS,xE,xS]=W[cur];const c=C[cur%4];
 slide.innerHTML=`<section class="left ${c==='#F0A81C'?'dk':''}" style="--c:${c}"><div class="pic" aria-hidden="true">${pic}</div><div class="word">${word}</div><div class="pos">${pos}</div><div class="gloss">${esc(gl)}</div><button class="say" id="say">🔊 Listen</button></section>
 <section class="right"><div class="sec"><div class="col en"><div class="lab">Definition</div><p>${esc(dE)}</p></div><div class="col es"><div class="lab">Definición</div><p>${esc(dS)}</p></div></div>
 <div class="sec"><div class="col en"><div class="lab">Example</div><p>${hi(xE,word)}</p></div><div class="col es"><div class="lab">Ejemplo</div><p>${esc(xS)}</p></div></div></section>`;
 document.getElementById('say').onclick=()=>say(word);
 [...dots.children].forEach((d,i)=>d.setAttribute('aria-current',i===cur));
 cnt.textContent=(cur+1)+' / '+W.length;prev.disabled=cur===0;next.disabled=cur===W.length-1;
 try{history.replaceState(null,'','#'+word)}catch(e){}
}
function go(i){cur=Math.max(0,Math.min(W.length-1,i));render()}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
document.getElementById('open').onclick=()=>ov.classList.add('on');
document.getElementById('close').onclick=()=>ov.classList.remove('on');
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);else if(e.key==='Escape')ov.classList.remove('on')});
let sx=null;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60)go(cur+(dx<0?1:-1));sx=null});
document.body.dataset.lang='both';
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.body.dataset.lang=b.dataset.l;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
let voice=null;
function pick(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang)&&/female|serena|kate|hazel|susan|libby|sonia|google uk english female/i.test(x.name))||v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
try{pick();speechSynthesis.onvoiceschanged=pick}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}
const h=decodeURIComponent(location.hash.slice(1));const i0=W.findIndex(w=>w[0]===h);if(i0>0)cur=i0;
render();
</script>
</body>
</html>
